<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091222">
  <meta name="description" content="Your 27-week C# DSA and systems interview preparation dashboard, backed by a real SQLite database.">
  <title>SDE Mission Control — Your 2027 Switch</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo"><div class="logo-icon"><span>∑</span></div><div><div class="logo-name">MISSION<span>CONTROL</span></div><div class="logo-sub">SDE JOURNEY • 2027</div></div></div>
      <div class="side-kicker">YOUR WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button data-view="roadmap" class="nav-link active"><span class="nav-emoji">◈</span> Roadmap <span class="nav-chevron">↗</span></button>
        <button data-view="rhythm" class="nav-link"><span class="nav-emoji">◷</span> Weekly rhythm</button>
        <button data-view="milestones" class="nav-link"><span class="nav-emoji">◇</span> Milestones</button>
        <button data-view="interviews" class="nav-link"><span class="nav-emoji">✦</span> Interview journal</button>
        <button data-view="applications" class="nav-link"><span class="nav-emoji">◎</span> Application tracker</button>
        <button data-view="resources" class="nav-link"><span class="nav-emoji">▤</span> Resource vault</button>
      </nav>
      <div class="side-divider"></div>
      <div class="side-kicker">MISSION PHASES</div>
      <div id="phase-nav" class="phase-nav" aria-label="Learning phases"></div>
      <div class="side-bottom">
        <div class="saving" id="sync-status" role="status"><span class="status-dot"></span><span>Connecting to database…</span></div>
        <div class="tiny-note">Progress lives in <strong>server-side SQLite</strong>.<br>Never in browser local storage.</div>
      </div>
    </aside>
    <div class="content-shell">
      <header class="topbar">
        <div class="breadcrumb"><span>SDE JOURNEY</span><span class="slash">/</span><strong id="breadcrumb-section">Roadmap</strong></div>
        <div class="top-actions"><div class="top-pill">⌁ &nbsp;C# / .NET</div><button id="export-btn" class="ghost-btn" title="Download a backup of your database progress">↓ &nbsp; Backup progress</button></div>
      </header>
      <main id="main" class="main-content" tabindex="-1"><div class="loading">Preparing your mission dashboard…</div></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="backup-input" type="file" accept=".json,application/json" hidden>
</body>
</html>
